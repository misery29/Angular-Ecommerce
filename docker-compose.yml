version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: festival_postgres
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: festival
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: festival_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ./app/backend
    container_name: festival_backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    volumes:
      - ./app/backend:/app
    environment:
      DATABASE_URL: postgresql://dev:dev@postgres:5432/festival
    command: sh -c "if [ ! -d ./prisma/migrations ] || [ -z \"$(ls -A ./prisma/migrations)\" ]; then npx prisma migrate dev --name init --skip-generate; fi && npx prisma generate && npx prisma migrate deploy && npx ts-node prisma/seed-admin.ts && npm run start:dev"

  frontend:
    build: ./app/frontend
    container_name: festival_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npx ng serve --host 0.0.0.0 --proxy-config proxy.conf.json

volumes:
  pgdata:
  redisdata:
